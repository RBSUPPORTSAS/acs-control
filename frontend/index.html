<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />
    <meta
        name="description"
        content="ACS Control - Administración amigable de ONU mediante GenieACS"
    />
    <title>ACS Control</title>
    <script>
        // Aplica el tema guardado antes de pintar (evita el destello oscuro/claro).
        try {
            if (localStorage.getItem('acs-theme') === 'light')
                document.documentElement.dataset.theme = 'light'
        } catch (e) {}
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
